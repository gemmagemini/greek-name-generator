<style>
  :root{
    --papyrus:#F3E9D2;
    --papyrus-2:#EADFC4;
    --ink:#2B1B12;
    --ink-soft:#5B4632;
    --terracotta:#BE4E2A;
    --terracotta-deep:#9A3A1C;
    --gold:#A97C3B;
    --gold-line: rgba(169,124,59,0.45);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--papyrus);
    font-family:'Noto Serif TC', serif;
    color:var(--ink);
    padding:48px 20px 64px;
    display:flex;
    justify-content:center;
  }
  .wrap{
    width:100%;
    max-width:560px;
  }
  .eyebrow{
    text-align:center;
    letter-spacing:0.35em;
    font-size:12px;
    color:var(--gold);
    margin-bottom:10px;
    text-transform:uppercase;
  }
  h1{
    text-align:center;
    font-size:28px;
    font-weight:700;
    margin:0 0 6px;
  }
  .sub{
    text-align:center;
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 32px;
    line-height:1.7;
  }
  .key-divider{
    display:flex;
    justify-content:center;
    margin:16px auto 28px;
    opacity:0.65;
  }
  .card{
    background:var(--papyrus-2);
    border:1px solid var(--gold-line);
    border-radius:4px;
    padding:32px 28px;
  }
  label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  input[type=text]{
    width:100%;
    font-family:'Noto Serif TC', serif;
    font-size:18px;
    padding:12px 14px;
    background:var(--papyrus);
    border:1px solid var(--gold-line);
    border-radius:3px;
    color:var(--ink);
    outline:none;
  }
  input[type=text]:focus{
    border-color:var(--terracotta);
  }
  .mode-row{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .mode-btn{
    flex:1;
    padding:14px 8px;
    font-family:'Noto Serif TC', serif;
    font-size:15px;
    font-weight:600;
    text-align:center;
    border-radius:3px;
    border:1px solid var(--terracotta);
    background:var(--papyrus);
    color:var(--terracotta-deep);
    cursor:pointer;
  }
  .mode-btn small{
    display:block;
    font-weight:400;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .mode-btn:hover{
    background:var(--terracotta);
    color:var(--papyrus);
  }
  .mode-btn:hover small{
    color:var(--papyrus);
    opacity:0.85;
  }
  .result{
    margin-top:32px;
    text-align:center;
    display:none;
  }
  .result.show{
    display:block;
  }
  .result .name{
    font-family:'Cinzel', serif;
    font-size:32px;
    font-weight:700;
    color:var(--terracotta-deep);
    letter-spacing:0.02em;
    line-height:1.3;
    word-break:break-word;
  }
  .result .line-en{
    font-family:'Cinzel', serif;
    font-size:14px;
    color:var(--ink-soft);
    letter-spacing:0.06em;
    margin-top:12px;
  }
  .result .line-zh{
    font-size:16px;
    color:var(--ink);
    margin-top:6px;
    font-weight:600;
  }
  .result .etymology{
    font-size:12.5px;
    color:var(--gold);
    margin-top:10px;
    font-style:italic;
  }
  .result .patron{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--gold-line);
  }
  .share-card{
    aspect-ratio: 1 / 1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 24px;
    box-sizing:border-box;
    background:var(--papyrus);
    border:4px double var(--gold);
    border-radius:2px;
    text-align:center;
    position:relative;
  }
  .share-key-strip{
    width:100%;
    max-width:180px;
    opacity:0.7;
    margin:6px 0;
  }
  .share-key-strip svg{
    width:100%;
    height:12px;
    display:block;
  }
  .share-title{
    font-size:12px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:20px;
  }
  .reroll{
    width:100%;
    margin-top:36px;
    padding:13px 8px;
    font-family:'Noto Serif TC', serif;
    font-size:15px;
    font-weight:600;
    text-align:center;
    background:var(--terracotta);
    color:var(--papyrus);
    border:1px solid var(--terracotta);
    border-radius:3px;
    cursor:pointer;
  }
  .reroll:hover{
    background:var(--terracotta-deep);
    border-color:var(--terracotta-deep);
  }
  .action-row{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .format-modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(26,18,16,0.55);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .format-modal-overlay.show{
    display:flex;
  }
  .format-modal{
    background:var(--papyrus);
    border:1px solid var(--gold-line);
    border-radius:4px;
    padding:24px;
    max-width:320px;
    width:100%;
    text-align:center;
  }
  .format-modal p{
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 18px;
  }
  .format-modal-btn{
    width:100%;
    padding:13px 8px;
    margin-bottom:10px;
    font-family:'Noto Serif TC', serif;
    font-size:15px;
    font-weight:600;
    background:var(--terracotta);
    color:var(--papyrus);
    border:1px solid var(--terracotta);
    border-radius:3px;
    cursor:pointer;
  }
  .format-modal-btn:hover{
    background:var(--terracotta-deep);
  }
  .format-modal-cancel{
    background:none;
    border:none;
    color:var(--gold);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    margin-top:4px;
    padding:6px;
  }
  .action-btn{
    flex:1;
    padding:12px 8px;
    font-family:'Noto Serif TC', serif;
    font-size:14px;
    font-weight:600;
    background:var(--papyrus);
    color:var(--terracotta-deep);
    border:1px solid var(--gold-line);
    border-radius:3px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .action-btn:hover{
    border-color:var(--terracotta);
  }
  .action-btn svg{
    width:15px;
    height:15px;
    flex-shrink:0;
  }
  .name-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
  }
  .pronounce-icon-btn{
    width:26px;
    height:26px;
    flex-shrink:0;
    border-radius:50%;
    border:1px solid var(--gold-line);
    background:var(--papyrus-2);
    color:var(--terracotta-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }

    background:var(--terracotta);
    color:var(--papyrus);
    border-color:var(--terracotta);
  }
  .pronounce-icon-btn svg{
    width:13px;
    height:13px;
    flex-shrink:0;
  }
</style>

    </div>

    <div class="result" id="result">

        <div class="name-row">
          <div class="name" id="outName">—</div>
          <button class="pronounce-icon-btn no-export" id="pronounceBtn" type="button" aria-label="聽聽看怎麼唸">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
          </button>
        </div>
        <div class="line-en" id="outLineEn">—</div>
        <div class="line-zh" id="outLineZh">—</div>
        <div class="etymology" id="outEtymology"></div>
        <div class="patron" id="outPatron"></div>
        <div class="share-key-strip">

        </div>
      </div>

      <button class="mode-btn" id="rerollBtn" style="width:100%; flex:none; margin-top:36px;">不喜歡這個名字，想看其他的</button>

      <div class="action-row">
        <button class="action-btn" id="downloadBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
          下載圖片
        </button>
        <button class="action-btn" id="shareBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.7l7.6-4.4M8.2 13.3l7.6 4.4"/></svg>
          分享
        </button>
      </div>
    </div>
  </div>
</div>

<div class="format-modal-overlay" id="formatModalOverlay">
  <div class="format-modal">

    <button class="format-modal-btn" id="pickStory">限動／Reels（9:16）</button>
    <button class="format-modal-btn" id="pickSquare">方形（1:1）</button>
    <button class="format-modal-cancel" id="pickCancel">取消</button>
  </div>
</div>

function seededShuffle(arr, seed){
  const a = arr.slice();
  let state = seed >>> 0;
  function rand(){
    state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
    return state / 4294967296;
  }
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const fallbackOrigins = [
  "查無明確的希臘／拉丁字根",
  "字源記載不完整",
  "尚未收錄於希臘語系字典",
  "跨越多種語言，字源難以追溯",
  "字源眾說紛紜，尚無定論"
];

function getEtymology(raw){
  const lower = raw.toLowerCase().trim();
  if(exactEtymology[lower]) return exactEtymology[lower];
  if(lower === "hassan"){
    const dom = godDefaultDomain["Nyx"];
    return {
      origin: fallbackOrigins[0],
      meaning: "尚未被記載的意義",
      godEn: "Nyx",
      godZh: godNameZh["Nyx"],
      domainZh: dom.zh,
      domainEn: dom.en,
      coreZh: dom.zh,
      coreEn: dom.en
    };
  }
  const base = transliterate(raw);
  const sortedRoots = rootEtymology.slice().sort((a,b)=> b.root.length - a.root.length);
  for(const r of sortedRoots){
    if(base.includes(r.root)) return r;
  }
  const godEn = fallbackOnlyGods[hashStr(base + "|fallbackgod") % fallbackOnlyGods.length];
  const dom = godDefaultDomain[godEn];
  const origin = fallbackOrigins[hashStr(base + "|fallbackorigin") % fallbackOrigins.length];
  return {
    origin,
    meaning:"尚未被記載的意義",
    godEn,
    godZh: godNameZh[godEn],
    domainZh: dom.zh,
    domainEn: dom.en,
    coreZh: dom.zh,
    coreEn: dom.en
  };
}

function hashStr(str){
  let h = 2166136261 >>> 0;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

function transliterate(raw){
  let s = raw.toLowerCase().replace(/[^a-z]/g,"");
  if(!s) return "";
  s = s.replace(/ck/g,"k").replace(/q/g,"k").replace(/w/g,"ou").replace(/v/g,"b").replace(/x/g,"ks");
  return s;
}

function detectGender(raw){
  const lower = raw.toLowerCase().trim();
  if(femaleNames.includes(lower)) return "female";
  if(maleNames.includes(lower)) return "male";
  if(/(a|ia|ella|etta|ie|lyn|beth|elle|ette)$/.test(lower)) return "female";
  if(/(us|er|on|an|ander|ios|o)$/.test(lower)) return "male";
  return "neutral";
}

function buildGreekName(raw, gender, salt, maxCount){
  const base = transliterate(raw);
  if(!base) return {name:"", suffixIdx:0};
  const fullPool = gender === "female" ? suffixFemale : gender === "male" ? suffixMale : suffixNeutral;
  const pool = fullPool.slice(0, Math.max(1, maxCount || fullPool.length));
  const h = hashStr(base + "|" + gender + "|" + salt);
  const suffixIdx = h % pool.length;
  const suffix = pool[suffixIdx];
  const lastChar = base[base.length-1];
  let joined;
  if(vowels.includes(lastChar) && vowels.includes(suffix[0])){
    const c = connectors[suffixIdx % connectors.length];
    joined = base + c + suffix;
  } else if(!vowels.includes(lastChar) && !vowels.includes(suffix[0])){
    joined = base + "e" + suffix;
  } else {
    joined = base + suffix;
  }
  return {name: joined.charAt(0).toUpperCase() + joined.slice(1), suffixIdx};
}

const classicPatronTemplates = [
  (godZh, domainZh) => `承襲${godZh}的職掌 · ${domainZh}`,
  (godZh, domainZh) => `${godZh}親自認可的血脈 · 象徵${domainZh}`,
  (godZh, domainZh) => `在${godZh}的注視下成長，繼承了${domainZh}的天賦`,
  (godZh, domainZh) => `${domainZh}，是${godZh}留給後代的印記`
];

function renderClassic(raw){
  const gender = detectGender(raw);
  const ety = getEtymology(raw);
  const built = buildGreekName(raw, gender, 0);

  let titleEnNoun, titleZhBare;
  if(gender === "male"){ titleEnNoun = "God"; titleZhBare = "神"; }
  else if(gender === "female"){ titleEnNoun = "Goddess"; titleZhBare = "女神"; }
  else { titleEnNoun = "Deity"; titleZhBare = "神祇"; }

  const tplIdx = built.suffixIdx % classicPatronTemplates.length;

  const override = nameOverrides[raw.toLowerCase().trim()];
  const displayName = override ? override[0].name : built.name;

  document.getElementById('outName').textContent = displayName;
  document.getElementById('outLineEn').textContent = `${titleEnNoun} of ${ety.domainEn}`;
  document.getElementById('outLineZh').textContent = `${ety.domainZh}${titleZhBare}`;
  document.getElementById('outEtymology').textContent = `字源 · ${ety.origin}，意為「${ety.meaning}」`;
  document.getElementById('outPatron').textContent = classicPatronTemplates[tplIdx](ety.godZh, ety.domainZh);
  document.getElementById('result').classList.add('show');
}

function renderPlayful(raw){
  const gender = detectGender(raw);
  const ety = getEtymology(raw);
  const themePool = getThemePool(ety);
  const built = buildGreekName(raw, gender, currentSalt, themePool.length);

  let titleEnNoun, titleZhBare;
  if(gender === "male"){ titleEnNoun = "God"; titleZhBare = "神"; }
  else if(gender === "female"){ titleEnNoun = "Goddess"; titleZhBare = "女神"; }
  else { titleEnNoun = "Deity"; titleZhBare = "神祇"; }

  const override = nameOverrides[raw.toLowerCase().trim()];
  let displayName, modEn, modZh;
  if(override){
    const pick = override[currentSalt % override.length];
    displayName = pick.name; modEn = pick.modEn; modZh = pick.modZh;
  } else {
    displayName = built.name;
    [modEn, modZh] = (function(){
      const orderSeed = hashStr(transliterate(raw) + "|" + gender + "|modorder|" + (ety.theme || godTheme[ety.godEn] || fallbackGodTheme[ety.godEn] || "__generic__"));
      const orderedPool = seededShuffle(themePool, orderSeed);
      return orderedPool[built.suffixIdx];
    })();
  }
  const trickster = getTrickster(ety);

  document.getElementById('outName').textContent = displayName;
  document.getElementById('outLineEn').textContent = `${modEn} ${titleEnNoun}`;
  document.getElementById('outLineZh').textContent = `${modZh}${titleZhBare}`;
  document.getElementById('outEtymology').textContent = `字源 · ${ety.origin}，意為「${ety.meaning}」`;
  document.getElementById('outPatron').textContent = `由惡作劇之神${trickster.zh}（${trickster.tag}）欽點`;
  document.getElementById('result').classList.add('show');
}

const SITE_URL = 'https://gemmagemini.github.io/greek-name-generator/';

const shareFormats = {
  story: {width:1080, height:1920, label:"限動／Reels"},
  square: {width:1080, height:1080, label:"訊息／方形"}
};

async function captureCard(formatKey){
  if(typeof html2canvas === 'undefined'){
    alert('圖片截圖功能載入失敗，可能是網路限制或瀏覽器擋掉了外部資源，請確認網路連線後重新整理頁面再試一次');
    return null;
  }
  const fmt = shareFormats[formatKey] || shareFormats.square;
  const node = document.getElementById('shareCard');
  const originalStyle = node.getAttribute('style') || '';
  const noExportEls = node.querySelectorAll('.no-export');
  noExportEls.forEach(el => el.style.visibility = 'hidden');

  node.style.position = 'fixed';
  node.style.top = '0';
  node.style.left = '0';
  node.style.zIndex = '2000';
  node.style.width = Math.round(fmt.width/2.7) + 'px';
  node.style.height = Math.round(fmt.height/2.7) + 'px';
  node.style.aspectRatio = 'auto';
  node.style.margin = '0';

  if(document.fonts && document.fonts.ready){
    try{ await document.fonts.ready; }catch(e){}
  }
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  try{
    const canvas = await html2canvas(node, {
      backgroundColor: '#EADFC4',
      scale: 2.7,
      useCORS: true,
      allowTaint: false
    });
    node.setAttribute('style', originalStyle);
    noExportEls.forEach(el => el.style.visibility = '');
    return canvas;
  }catch(err){
    node.setAttribute('style', originalStyle);
    noExportEls.forEach(el => el.style.visibility = '');
    console.error('html2canvas failed:', err);
    alert('截圖失敗了，可能是網路或瀏覽器限制造成的，可以試試看重新整理頁面，或直接對這個結果卡截圖分享');
    return null;
  }
}

function canvasToBlob(canvas){
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

async function doDownload(formatKey){
  const nameText = document.getElementById('outName').textContent || 'greek-name';
  const win = window.open('', '_blank');
  const canvas = await captureCard(formatKey);
  if(!canvas){
    if(win) win.close();
    return;
  }
  const dataUrl = canvas.toDataURL('image/png');
  if(win){
    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${nameText}</title>
      <style>
        body{margin:0;background:#1a1210;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;}
        img{max-width:100%;max-height:80vh;width:auto;height:auto;}
        p{color:#e8dcc4;padding:20px;text-align:center;font-size:15px;line-height:1.6;}
      </style>
      </head><body>
      <img src="${dataUrl}" alt="${nameText}"/>
      <p>長按圖片，選擇「儲存到照片」即可存到相簿</p>
      </body></html>`);
    win.document.close();
  } else {
    const link = document.createElement('a');
    link.download = `${nameText}.png`;
    link.href = dataUrl;
    link.click();
  }
}

async function doShare(formatKey){
  const nameText = document.getElementById('outName').textContent || 'greek-name';
  const titleZh = document.getElementById('outLineZh').textContent || '';
  const shareText = `我的希臘名字是 ${nameText}，${titleZh}\n點這裡找尋你的希臘名字：${SITE_URL}`;
  const canvas = await captureCard(formatKey);
  if(!canvas) return;
  const blob = await canvasToBlob(canvas);
  if(!blob){
    alert('圖片產生失敗，請再試一次');
    return;
  }
  const file = new File([blob], `${nameText}.png`, {type:'image/png'});

  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({
        files:[file],
        title:'我的希臘名字',
        text: shareText
      });
      return;
    }catch(err){
      if(err && err.name === 'AbortError') return;
      console.error('share failed:', err);
    }
  }
  const link = document.createElement('a');
  link.download = `${nameText}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  alert('這個瀏覽器不支援直接分享，圖片已經幫你下載，可以手動上傳到 Instagram / Facebook / Threads');
}

const formatModalOverlay = document.getElementById('formatModalOverlay');

if('speechSynthesis' in window){
  document.getElementById('pronounceBtn').addEventListener('click', ()=>{
    const nameText = document.getElementById('outName').textContent;
    if(!nameText || nameText === '—') return;
    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(utter);
  });
} else {
  const btn = document.getElementById('pronounceBtn');

}
